<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Library</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
  <style>
    h2 {
      height: fit-content;
    }
    .card {
      width: 250px;
      margin-top: 20px;
      height: 490px;
    }

    .card:hover {
      width: 255px;
      height: 495px;
      transition: 0.2s;
    }
    .card > img {
      border-radius: 5px;
    }
    body {
      text-align: center;
      color: white;
      
    }


    .outer_right {
      display: flex;
      background-color: rgb(33, 33, 33);
      flex-wrap: wrap;
      width: 100%;
      color: white;
      margin: 10px;
      position: relative;
      right: 0;
      overflow-y: scroll;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .outer_right>div {
      padding: 2px;
      margin: 20px;
      font-weight: 500;
    }

    .add {
      color: white;
      padding: 20px;
    }
  </style>
</head>


<body style="background-color: black">

  {% block body %}
  {% endblock %}
</body>

</html>
