<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      a {
        text-decoration: none;
        color: white;
      }

      h2 {
        height: fit-content;
      }

      .card {
        width: 250px;
        margin-top: 20px;
        height: auto;
        margin-top: 50px;
        margin-bottom: 50px;
      }

      .card:hover {
        width: 255px;
        height: 570px;
        transition: 0.2s;
      }

      .card > img {
        border-radius: 5px;
      }

      body {
        text-align: center;
        color: white;
      }

      .outer_right {
        display: flex;
        background-color: rgb(33, 33, 33);
        flex-wrap: wrap;
        width: 100%;
        color: white;
        margin: 10px;
        position: relative;
        right: 0;
        overflow-y: scroll;
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .outer_right > div {
        padding: 2px;
        margin: 20px;
        font-weight: 500;
      }

      .add {
        color: white;
        padding: 20px;
      }

      .program {
        display: flex;
        background-color: rgb(33, 33, 33);
        flex-wrap: wrap;
        width: 100%;
        color: white;
        margin: 10px;
        overflow-y: scroll;
        -ms-overflow-style: none;
        scrollbar-width: none;
        width: 100%;
        align-items: stretch;
        gap: 20px;
        height: 600px;
      }

      .program > div {
        padding: 2px;
        margin: 20px;
        font-weight: 500;
      }
    </style>
  </head>
  <nav class="nav">
    <h4>{{ request.user.username }}</h4>
    <form action="{% url 'logout' %}" method="post">
      {% csrf_token %}
      <button type="submit" class="btn">Log out</button>
    </form>
  </nav>

  <body style="background-color: black">
    {% block body %} {% endblock %}
  </body>
</html>
