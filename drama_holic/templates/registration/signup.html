{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
{% if form.errors %}
    <p style="background-color: rgb(229, 141, 141);">{{ form.errors }}</p>
{% endif %}
<h2>Sign up</h2>
<form action="" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign up</button>
</form>
{% endblock %}
