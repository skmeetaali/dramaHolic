{% extends "base.html" %}
{% block title %}Home{% endblock %}

{% block content %}

{% if user.is_authenticated %}
Hi! {{ user.username }}
<form action="{% url 'logout' %}" method="post">
{% csrf_token %}
<button type="submit">Log out</button>
</form>
{% else %}
<p>You are logged out</p>
<a href="{% url 'login' %}">Login</a>

{% endif %}
{% endblock %}
